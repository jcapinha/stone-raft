[workspace]
resolver = "2"
members = ["engine", "host-common", "host-wsl", "host-windows", "host-daisy"]

# Daisy audio runs from flash. Thin LTO lets the codec callback inline the
# engine, so a heavy voice does not pay a separate call for every oscillator sample.
[profile.release]
lto = "thin"
codegen-units = 1

# Temporary whine check. Delete this patch and host-daisy/vendor/daisy-embassy
# after the 16-sample listen. Published daisy-embassy 0.3.0 uses a 32-sample batch.
[patch.crates-io]
daisy-embassy = { path = "host-daisy/vendor/daisy-embassy" }
