[package]
name = "host-daisy"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7", features = [
    "critical-section-single-core",
    "inline-asm",
] }
cortex-m-rt = { version = "0.7", features = ["device"] }
daisy-embassy = { version = "0.3", features = ["seed3"] }
defmt-rtt = "1"
embassy-executor = { version = "0.10", features = [
    "defmt",
    "executor-thread",
    "platform-cortex-m",
] }
embassy-time = "0.5"
panic-probe = { version = "1", features = ["print-defmt"] }

[[bin]]
name = "double-blink"
path = "src/bin/double_blink.rs"
test = false
bench = false

[[bin]]
name = "breadboard-led"
path = "src/bin/breadboard_led.rs"
test = false
bench = false
